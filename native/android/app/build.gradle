plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.atmoshaper.app'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.atmoshaper.app'
        minSdk 28
        targetSdk 36
        versionCode 8
        versionName '0.5.1-native-clock-preview'
        resValue 'string', 'app_name', 'AtmoShaper'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        // Publicly known debug credentials only; never use this for distribution.
        debug {
            storeFile rootProject.file('../../output/android-tools/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.development'
            resValue 'string', 'app_name', 'AtmoShaper Preview'
            signingConfig signingConfigs.debug
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    // The named npm build creates this verified, app-owned asset set first.
    sourceSets.main.assets.srcDir rootProject.file('../../output/offline-core')
    lint { abortOnError true }
}

kotlin { jvmToolchain(17) }

tasks.register('verifyDebugPreview') {
    group = 'verification'
    description = 'Lint and assemble the debug preview and its installed-app test APK.'
    dependsOn 'lintDebug', 'assembleDebug', 'assembleDebugAndroidTest'
}

dependencies {
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation platform('androidx.compose:compose-bom:2025.08.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
