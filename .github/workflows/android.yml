name: Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native_home:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run the legacy WebView launcher journey on a fresh emulator. Two
          # full runs lost the emulator at that class after the Clock tests.
          - check: Native Android build and Home journey
            filter: class=com.atmoshaper.app.HomeJourneyTest
          - check: Native Android installed tools
            filter: notClass=com.atmoshaper.app.HomeJourneyTest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '8.13'
      - run: npm ci
      - run: npm run build:offline-core
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          # Compile with API 36 while exercising the Home journey on Android 35.
          api-level: 36
          system-image-api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: native/android
          # The emulator action installs the SDK before running this hook.
          pre-emulator-launch-script: |
            mkdir -p ../../output/android-tools
            keytool -genkeypair -keystore ../../output/android-tools/debug.keystore -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug' -keyalg RSA -keysize 2048 -validity 365
            gradle --no-daemon :app:verifyDebugPreview
          script: gradle --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.${{ matrix.filter }}
